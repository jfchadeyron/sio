name: Publication du site

on:
  push:
    branches: [main]
  schedule:
    # Les documents s'ouvrent à minuit (heure de Paris), le jour indiqué dans publication.json.
    # Plusieurs passages dans la nuit, le matin et le soir : GitHub peut retarder ou sauter
    # une exécution programmée, et l'heure de Paris change deux fois par an.
    - cron: "17 23 * * *"     # vers 0 h 15 (hiver) ou 1 h 15 (été), heure de Paris
    - cron: "17 1 * * *"      # vers 2 h 15 ou 3 h 15
    - cron: "5 4,5,6 * * *"   # entre 5 h et 8 h
    - cron: "5 17,18 * * *"   # entre 18 h et 20 h
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les documents ouverts à ce jour
        env:
          CLE_SITE: ${{ secrets.CLE_SITE }}
        run: python3 outils/publier.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
